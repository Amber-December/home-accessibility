<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>清先住 LiveFirst · 试住</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "postprocessing": "./vendor/postprocessing/index.js",
      "n8ao": "./vendor/n8ao/N8AO.js",
      "camera-controls": "./vendor/camera-controls/camera-controls.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <div id="view" role="img" aria-label="户型三维视图"></div>
    <div id="split-labels" hidden><span>改造前</span><span id="split-right">方案</span></div>
  </div>

  <header class="glass">
    <a class="brand" href="index.html"><img src="logo.svg" alt="" width="30" height="30"><b>清先住</b><span class="en">LiveFirst</span></a>
    <nav class="modes" aria-label="模式"><a href="index.html" aria-current="page">试住</a><a href="lab.html">实验室</a><a href="library.html">素材库</a></nav>
    <nav id="steps" aria-label="试住步骤"></nav>
    <div class="menu" id="scene">
      <button class="menu-btn" data-act="sceneMenu" aria-haspopup="menu" aria-expanded="false" aria-controls="scene-list">情景<b id="scene-name"></b><i aria-hidden="true">▾</i></button>
      <div id="scene-list" class="menu-list glass" role="menu" aria-label="情景" hidden></div>
    </div>
    <div class="seg" id="styles" role="group" aria-label="画面风格">
      <button data-act="style" data-arg="real">实景</button>
      <button data-act="style" data-arg="diag">诊断</button>
    </div>
  </header>

  <aside id="chat" class="glass panel left" aria-label="对话"></aside>
  <button class="fold left" data-act="fold" data-arg="left" aria-label="收起对话面板" aria-expanded="true">‹</button>
  <aside id="detail" class="glass panel right" aria-label="详情"><div id="panel" aria-live="polite"></div><div id="pick"></div></aside>
  <button class="fold right" data-act="fold" data-arg="right" aria-label="收起详情面板" aria-expanded="true">›</button>
  <nav id="sheet-tabs" class="glass" role="tablist" aria-label="面板">
    <button role="tab" data-act="sheet" data-arg="chat" aria-selected="false">对话</button>
    <button role="tab" data-act="sheet" data-arg="detail" aria-selected="true">详情</button>
  </nav>

  <div id="tools">
    <div class="seg glass" id="views" role="group" aria-label="视角">
      <button data-act="view" data-arg="top" title="快捷键 1">俯视</button>
      <button data-act="view" data-arg="follow" title="快捷键 2">跟随</button>
      <button data-act="view" data-arg="fp" title="快捷键 3">第一人称</button>
      <button data-act="view" data-arg="walk" title="快捷键 4；方向键或 WASD 移动，拖动转头，Esc 退出">步入</button>
    </div>
    <div class="seg glass" id="layers" role="group" aria-label="图层">
      <label><input type="checkbox" data-act="layer" data-arg="heat">通行余量</label>
      <label><input type="checkbox" data-act="layer" data-arg="sweep">门扫掠</label>
      <label><input type="checkbox" data-act="layer" data-arg="fp" checked>判定外形</label>
    </div>
  </div>
  <div id="walk-hint" class="glass" hidden>步入：方向键或 WASD 移动，拖动画面转头，Esc 退出。手动操作不进报告。</div>
  <div id="subtitle" role="status" hidden></div>
  <div id="problem" class="glass" role="alertdialog" aria-live="assertive" hidden></div>
  <footer id="timeline" class="glass" aria-label="时间线"></footer>
  <div id="loading" role="status"><span class="braille big" data-braille="先住" aria-hidden="true"></span><span>正在加载户型…</span></div>

  <input id="floorplan-file" type="file" accept="image/png,image/jpeg,application/pdf,.json" hidden>
  <script defer src="js/text.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
