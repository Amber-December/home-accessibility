# M3 Lux3D asset catalog (docs/tech/aholo-lux3d.md §3). checked_at = date the reference pages were read.
# nominal_m = W x D x H used by the evaluator (accessibility checks use these, never the generated mesh).
# published = dimension text as read on the source page; source_quality: page | pdf | search_snippet.
# route: multiview_g1turbo = 1 image -> 4-view (24 cr) -> G1-Turbo PBR 20k faces, aiPredictSize=false
#        text_to_3d        = no usable image URL (13 cr)
# articulate: run Lux3D articulation (28 cr) to get door sweep.
# create 记录见 ledger（docs/tech/aholo-lux3d.md §3）。
version: 1
