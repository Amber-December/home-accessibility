name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: env/requirements-lock.txt
      - name: Install
        run: pip install -r env/requirements-lock.txt pytest==9.2.0
      - name: Test
        run: pytest -q tests/
